<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiC - Consulta de Lentes e Orçamento</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { background: #f8f9fa; }
    /* Ajustado para ocupar 100% da largura da página (Ideal para Computador) */
    .app { background: #fff; min-height: 100vh; font-family: 'Barlow', sans-serif; color: #1a1a2e; padding-bottom: 140px; width: 100%; margin: 0; box-shadow: none; position: relative; }
    
    .topbar { background: #42a5f5; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .topbar i { font-size: 22px; color: #fff; cursor: pointer; }
    
    .header { padding: 20px 20px 12px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #e8f4fe; }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    
    .logo-icon { height: 45px; width: auto; max-width: 180px; object-fit: contain; }
    .logo-text { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; color: #0d47a1; letter-spacing: -0.5px; }
    .logo-text span { color: #42a5f5; }
    .logo-sub { font-size: 10px; font-weight: 600; color: #78909c; letter-spacing: 0.8px; margin-top: -2px; }
    
    .search-section { padding: 16px 20px; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
    .search-wrapper { position: relative; max-width: 800px; margin: 0 auto; } /* Centraliza e limita a barra de busca no PC */
    .search-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #90a4ae; font-size: 18px; }
    .search-input { width: 100%; padding: 14px 16px 14px 42px; border: 1.5px solid #cfd8dc; border-radius: 8px; font-size: 16px; font-family: inherit; transition: all 0.2s; outline: none; color: #1a1a2e; }
    .search-input:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }
    
    .nav-tabs { display: flex; border-bottom: 2px solid #f0f0f0; background: #fff; gap: 4px; padding: 0 20px; }
    .tab-btn { flex: 1; text-align: center; padding: 16px 10px; border: none; background: none; font-size: 14px; font-weight: 600; color: #78909c; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: inherit; transition: all 0.2s; white-space: nowrap; }
    .tab-btn.active { color: #0d47a1; border-bottom-color: #0d47a1; font-size: 15px; }
    
    .brand-bar { padding: 14px 20px; background: #fff; display: flex; gap: 12px; border-bottom: 1px solid #f0f0f0; padding-left: 20px; }
    .brand-btn { padding: 8px 20px; border: 1px solid #cfd8dc; border-radius: 20px; background: #fff; font-size: 14px; font-weight: 500; color: #546e7a; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .brand-btn.active { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; font-weight: 600; }
    
    .meta-bar { padding: 12px 20px; background: #fdfdfd; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f5f5f5; min-height: 42px; }
    .count-text { font-size: 13px; color: #78909c; font-weight: 500; }
    
    /* Resultados em Grid no computador para aproveitar o espaço largo da tela */
    .results-list { padding: 15px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 12px; }
    .result-item { padding: 16px 20px; border: 1px solid #f0f0f0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; cursor: pointer; background: #fff; }
    .result-item:hover { background: #f5f9ff; border-color: #90caf9; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .result-item:active { background: #e3f2fd; }
    .result-name { font-size: 14px; font-weight: 500; color: #2c3e50; line-height: 1.4; padding-right: 12px; }
    .result-price { font-size: 16px; font-weight: 700; color: #2e7d32; white-space: nowrap; background: #e8f5e9; padding: 6px 12px; border-radius: 6px; }
    
    .empty { padding: 80px 20px; text-align: center; color: #90a4ae; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 12px; grid-column: 1 / -1; }
    .empty i { font-size: 40px; color: #b0bec5; }
    
    /* MODAL DE DETALHES */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: #fff; width: 100%; max-width: 500px; border-radius: 12px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; animation: fadeInUp 0.3s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-close { position: absolute; top: 18px; right: 18px; font-size: 24px; color: #90a4ae; cursor: pointer; }
    .modal-title { font-size: 20px; font-weight: 700; color: #0d47a1; margin-bottom: 20px; padding-right: 24px; border-bottom: 2px solid #e3f2fd; padding-bottom: 10px; text-transform: uppercase; }
    .modal-info { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .info-row { display: flex; justify-content: space-between; font-size: 15px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 8px; }
    .info-label { color: #78909c; font-weight: 500; }
    .info-value { color: #1a1a2e; font-weight: 600; text-transform: uppercase; }
    .info-value.price { color: #2e7d32; font-size: 20px; font-weight: 700; }
    .btn-add-budget { width: 100%; background: #0d47a1; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .btn-add-budget:hover { background: #1565c0; }

    /* BARRA FIXA DE ORÇAMENTO TOTALMENTE EXPANDIDA PARA O MONITOR */
    .budget-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 4px solid #42a5f5; box-shadow: 0 -5px 20px rgba(0,0,0,0.08); padding: 16px 40px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
    .budget-container { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .budget-header { display: flex; justify-content: space-between; align-items: center; }
    .budget-title { font-size: 14px; font-weight: 700; color: #546e7a; display: flex; align-items: center; gap: 6px; }
    .btn-clear-budget { background: none; border: none; color: #e53935; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .budget-lens-name { font-size: 14px; color: #1a1a2e; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .budget-inputs { display: flex; gap: 30px; align-items: center; }
    .input-frame-wrapper { width: 250px; position: relative; }
    .input-frame-wrapper span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #78909c; font-weight: 600; }
    .input-frame { width: 100%; padding: 10px 10px 10px 36px; border: 1.5px solid #cfd8dc; border-radius: 6px; font-size: 15px; font-family: inherit; font-weight: 600; color: #1a1a2e; outline: none; }
    .input-frame:focus { border-color: #42a5f5; }
    .budget-total { text-align: right; white-space: nowrap; margin-left: auto; }
    .total-label { font-size: 12px; font-weight: 600; color: #78909c; display: block; margin-bottom: -2px; }
    .total-val { font-size: 24px; font-weight: 700; color: #2e7d32; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; display: inline-block; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app">
  <div class="topbar">
    <i class="ti ti-chevron-left"></i>
  </div>
  
  <div class="header">
    <div class="logo-wrap">
      <img src="optiC logo.jpeg" class="logo-icon" alt="Logo OptiC">
      <div>
        <div class="logo-text">Opti<span>C</span></div>
        <div class="logo-sub">GESTÃO INTELIGENTE PARA ÓTICAS</div>
      </div>
    </div>
  </div>

  <div class="search-section">
    <div class="search-wrapper">
      <i class="ti ti-search"></i>
      <input type="text" id="search" class="search-input" placeholder="Buscar lente...">
    </div>
  </div>

  <div class="nav-tabs" id="cat-tabs"></div>
  <div class="brand-bar" id="brand-tabs"></div>

  <div class="meta-bar">
    <div class="count-text" id="count-label"></div>
  </div>

  <div class="results-list" id="results"></div>
</div>

<div class="budget-bar" id="budget-bar" style="display: none;">
  <div class="budget-container">
    <div class="budget-header">
      <div class="budget-title"><i class="ti ti-calculator"></i> ORÇAMENTO DO CLIENTE</div>
      <button class="btn-clear-budget" onclick="clearBudget()"><i class="ti ti-trash"></i> Limpar Orçamento</button>
    </div>
    <div class="budget-inputs">
      <div style="flex: 2; min-width: 0;">
        <div class="total-label">LENTE SELECIONADA</div>
        <div class="budget-lens-name" id="budget-lens-name">-</div>
      </div>
      <div class="input-frame-wrapper">
        <div class="total-label">VALOR DA ARMAÇÃO</div>
        <span>R$</span>
        <input type="number" id="input-frame-price" class="input-frame" placeholder="0,00" oninput="calculateTotal()">
      </div>
      <div class="budget-total">
        <span class="total-label">VALOR TOTAL DO ÓCULOS</span>
        <span class="total-val" id="budget-total-value">R$ 0,00</span>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <i class="ti ti-x modal-close" onclick="closeModal(null)"></i>
    <div class="modal-title" id="modal-lens-title">Detalhes da Lente</div>
    <div class="modal-info">
      <div class="info-row"><span class="info-label">Categoria:</span><span class="info-value" id="modal-lens-cat">-</span></div>
      <div class="info-row"><span class="info-label">Marca/Fabricante:</span><span class="info-value" id="modal-lens-brand">-</span></div>
      <div class="info-row" style="border:none; margin-top:10px;"><span class="info-label" style="font-size:16px; font-weight:700;">Preço da Lente:</span><span class="info-value price" id="modal-lens-price">R$ 0,00</span></div>
    </div>
    <button class="btn-add-budget" onclick="addSelectedToBudget()"><i class="ti ti-circle-plus"></i> Adicionar ao Orçamento</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://wcurvwdgezjixosxivfn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HtxQzlwkS86rb1OI2KrEbA_o44lj6vw";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const categories = ["SIMPLES", "SURFAÇADA", "OCUPACIONAIS", "PROGRESSIVAS"];

// Ajuste definitivo: Removido "VARILUX", mantendo apenas KODAK e ESSILOR em todas as abas
const brandMap = {
  "SIMPLES": ["KODAK", "ESSILOR"],
  "SURFAÇADA": ["KODAK", "ESSILOR"],
  "OCUPACIONAIS": ["KODAK", "ESSILOR"],
  "PROGRESSIVAS": ["KODAK", "ESSILOR"]
};

let activeCat = "SIMPLES";
let activeBrand = "KODAK";
let query = "";
let selectedLensForBudget = null;
let currentResults = [];
let temporarySelectedLens = null;

function formatCurrency(value) {
  const numericValue = parseFloat(value);
  if (isNaN(numericValue)) return "Consulte";
  return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(numericValue);
}

function renderCategories() {
  const el = document.getElementById("cat-tabs");
  el.innerHTML = categories.map(c => `
    <button class="tab-btn ${c === activeCat ? "active" : ""}" data-cat="${c}">${c}</button>`).join("");
  el.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
    activeCat = btn.dataset.cat;
    activeBrand = brandMap[activeCat][0];
    query = ""; document.getElementById("search").value = "";
    renderAll();
  }));
}

function renderBrandTabs() {
  const brands = brandMap[activeCat] || [];
  const el = document.getElementById("brand-tabs");
  el.innerHTML = brands.map(b => `
    <button class="brand-btn ${b === activeBrand ? "active" : ""}" data-brand="${b}">${b}</button>`).join("");
  el.querySelectorAll(".brand-btn").forEach(btn => btn.addEventListener("click", () => {
    activeBrand = btn.dataset.brand;
    query = ""; document.getElementById("search").value = "";
    renderBrandTabs(); renderResults();
  }));
}

async function renderResults() {
  const q = query.trim();
  const el = document.getElementById("results");
  const countEl = document.getElementById("count-label");

  if (!q) {
    countEl.textContent = "";
    el.innerHTML = `
      <div class="empty">
        <i class="ti ti-search" aria-hidden="true"></i>
        Digite o nome da lente acima para buscar...
      </div>`;
    return;
  }

  el.innerHTML = `<div class="empty"><i class="ti ti-loader animate-spin"></i>Buscando no banco de dados...</div>`;

  try {
    const catLowerPlural = activeCat.toLowerCase(); 
    const catLowerSingular = catLowerPlural.endsWith('s') ? catLowerPlural.slice(0, -1) : catLowerPlural;

    let queryBuilder = supabaseClient
      .from('lentes')
      .select('*')
      .eq('marca', activeBrand.toLowerCase())
      .ilike('nome', `%${q}%`);

    if (activeCat === "OCUPACIONAIS") {
      queryBuilder = queryBuilder.ilike('categoria', '%ocupacio%');
    } else {
      queryBuilder = queryBuilder.in('categoria', [catLowerPlural, catLowerSingular]);
    }

    const { data: filtered, error } = await queryBuilder;

    if (error) throw error;

    currentResults = filtered || [];
    countEl.textContent = currentResults.length + " produto" + (currentResults.length !== 1 ? "s encontrado(s)" : " encontrado");

    if (!currentResults.length) {
      el.innerHTML = `<div class="empty"><i class="ti ti-zoom-cancel" aria-hidden="true"></i>Nenhum resultado para "${query}"</div>`;
      return;
    }

    el.innerHTML = currentResults.map((item, index) => `
      <div class="result-item" onclick="openModal(${index})">
        <span class="result-name">${item.nome}</span>
        <span class="result-price">${formatCurrency(item.preco)}</span>
      </div>`).join("");

  } catch (err) {
    console.error("Erro na busca:", err);
    el.innerHTML = `<div class="empty"><i class="ti ti-alert-triangle"></i>Erro ao carregar dados do Supabase.</div>`;
  }
}

function openModal(index) {
  if (index === null || currentResults[index] === undefined) return;
  temporarySelectedLens = currentResults[index];
  
  document.getElementById("modal-lens-title").textContent = temporarySelectedLens.nome;
  document.getElementById("modal-lens-cat").textContent = temporarySelectedLens.categoria;
  document.getElementById("modal-lens-brand").textContent = temporarySelectedLens.marca;
  document.getElementById("modal-lens-price").textContent = formatCurrency(temporarySelectedLens.preco);
  document.getElementById("modal-overlay").style.display = "flex";
}

function closeModal(e) {
  document.getElementById("modal-overlay").style.display = "none";
  temporarySelectedLens = null;
}

function addSelectedToBudget() {
  if (!temporarySelectedLens) return;
  selectedLensForBudget = temporarySelectedLens;
  
  document.getElementById("budget-lens-name").textContent = selectedLensForBudget.nome;
  document.getElementById("budget-bar").style.display = "flex";
  
  calculateTotal();
  closeModal(null);
}

function calculateTotal() {
  if (!selectedLensForBudget) return;
  const lensPrice = parseFloat(selectedLensForBudget.preco) || 0;
  const framePrice = parseFloat(document.getElementById("input-frame-price").value) || 0;
  
  const total = lensPrice + framePrice;
  document.getElementById("budget-total-value").textContent = formatCurrency(total);
}

function clearBudget() {
  selectedLensForBudget = null;
  document.getElementById("input-frame-price").value = "";
  document.getElementById("budget-lens-name").textContent = "-";
  document.getElementById("budget-total-value").textContent = "R$ 0,00";
  document.getElementById("budget-bar").style.display = "none";
}

function renderAll() { 
  renderCategories(); 
  renderBrandTabs(); 
  renderResults(); 
}

document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value;
  renderResults();
});

renderAll();
</script>

</body>
</html>
